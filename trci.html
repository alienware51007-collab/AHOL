<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Place Explorer</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        body { overflow: hidden; }
        #page {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        #pageTitle {
            font-size: 24px;
            letter-spacing: 2px;
            text-align: center;
        }
        #appendNewObject {
            padding: 12px 20px;
            background: #151515;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
            font-size: 14px;
        }
        #appendNewObject:hover { background: #252525; }
        #placeExplorer {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: none;
            background: rgba(0, 0, 0, 0.92);
        }
        #placeExplorerWindow {
            position: absolute;
            inset: 30px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #101010;
            border: 1px solid #555;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }
        #placeExplorerHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #181818;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }
        #placeExplorerHeader strong { letter-spacing: 1px; }
        #closePlaceExplorer {
            width: 34px;
            height: 30px;
            background: #222;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }
        #closePlaceExplorer:hover { background: #333; }
        #placeSearchBar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #placeSearch,
        #walkCommand {
            flex: 1;
            min-width: 0;
            padding: 10px;
            background: #080808;
            color: white;
            border: 1px solid #555;
            outline: none;
        }
        #placeSearch:focus,
        #walkCommand:focus { border-color: white; }
        #loadPlaceButton,
        #walkGoButton {
            padding: 10px 16px;
            background: #222;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }
        #loadPlaceButton:hover,
        #walkGoButton:hover { background: #333; }
        #loadPlaceButton:disabled,
        #walkGoButton:disabled {
            opacity: 0.5;
            cursor: wait;
        }
        #placeView {
            position: relative;
            flex: 1;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #050505;
            perspective: 900px;
        }
        #placeWalkLayer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 220ms ease-out;
            pointer-events: none;
        }
        #placeWalkLayer.is-walking {
            pointer-events: auto;
        }
        #placeImage {
            display: none;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }
        #placeWalkLayer.is-walking #placeImage {
            max-width: none;
            max-height: none;
            width: 140%;
            height: auto;
        }
        #placeLoading {
            position: relative;
            z-index: 2;
            color: #aaa;
            text-align: center;
            padding: 30px;
            max-width: 600px;
            line-height: 1.5;
        }
        #placeHUD {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 12px;
            background: #151515;
            border-top: 1px solid #444;
            border-bottom: 1px solid #333;
            font-size: 12px;
            flex-shrink: 0;
        }
        #placeHUD div {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        #placeHUD span {
            color: #888;
            font-size: 10px;
        }
        #placeHUD strong {
            color: white;
            word-break: break-word;
        }
        #placeNavigation {
            padding: 12px;
            text-align: center;
            background: #111;
            flex-shrink: 0;
        }
        #placeNavigation button {
            min-width: 45px;
            min-height: 35px;
            margin: 3px;
            background: #222;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
        }
        #placeNavigation button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #placeNavigation button:not(:disabled):hover {
            background: #333;
        }
        #placeNavigation small {
            display: block;
            margin-top: 8px;
            color: #777;
        }
        #walkCommandBar {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
            background: #111;
            flex-shrink: 0;
        }
        #placeStatus {
            padding: 8px 12px;
            background: #080808;
            color: #888;
            font-size: 11px;
            flex-shrink: 0;
            min-height: 30px;
        }
        @media (max-width: 700px) {
            body { overflow: auto; }
            #placeExplorerWindow {
                inset: 10px;
                overflow-y: auto;
            }
            #placeView {
                min-height: 250px;
                flex: none;
                height: 40vh;
            }
            #placeHUD { grid-template-columns: repeat(2, 1fr); }
            #placeSearchBar,
            #walkCommandBar { flex-direction: column; }
            #loadPlaceButton,
            #walkGoButton { width: 100%; }
        }
    </style>
</head>
<body>
    <main id="page">
        <div id="pageTitle">UNIVERSAL PLACE EXPLORER</div>
        <button id="appendNewObject" type="button">APPEND NEW OBJECT</button>
    </main>

    <div id="placeExplorer" aria-hidden="true">
        <div id="placeExplorerWindow">
            <header id="placeExplorerHeader">
                <strong>UNIVERSAL PLACE EXPLORER</strong>
                <button id="closePlaceExplorer" type="button" aria-label="Close Universal Place Explorer">X</button>
            </header>
            <div id="placeSearchBar">
                <input
                    id="placeSearch"
                    type="text"
                    placeholder="Type a popular destination..."
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="loadPlaceButton" type="button">LOAD PLACE</button>
            </div>
            <div id="placeView">
                <div
                    id="placeWalkLayer"
                    data-placement="move"
                    data-vector="0,0,1"
                    data-heading="0"
                >
                    <img id="placeImage" src="" alt="">
                </div>
                <div id="placeLoading">Type a destination above.</div>
            </div>
            <div id="placeHUD">
                <div>
                    <span>UNIVERSAL ID</span>
                    <strong id="placeUniversalID">—</strong>
                </div>
                <div>
                    <span>PLACE</span>
                    <strong id="placeTitle">—</strong>
                </div>
                <div>
                    <span>CLASSIFICATION</span>
                    <strong id="placeClassification">UNDEFINED</strong>
                </div>
                <div>
                    <span>LATITUDE</span>
                    <strong id="placeLatitude">—</strong>
                </div>
                <div>
                    <span>LONGITUDE</span>
                    <strong id="placeLongitude">—</strong>
                </div>
            </div>
            <div id="placeNavigation">
                <button type="button" data-direction="up" disabled aria-label="Move forward">↑</button>
                <br>
                <button type="button" data-direction="left" disabled aria-label="Look left">←</button>
                <button type="button" data-direction="down" disabled aria-label="Move back">↓</button>
                <button type="button" data-direction="right" disabled aria-label="Look right">→</button>
                <small id="walkHint">WALKING — type:in forward / back / left / right / look / reset</small>
            </div>
            <div id="walkCommandBar">
                <input
                    id="walkCommand"
                    type="text"
                    placeholder="type:in forward"
                    autocomplete="off"
                    spellcheck="false"
                    disabled
                >
                <button id="walkGoButton" type="button" disabled>WALK</button>
            </div>
            <div id="placeStatus">READY</div>
        </div>
    </div>

    <script>
        "use strict";

        const UNIVERSAL_OBJECTS = [];
        window.__UNIVERSAL_OBJECTS__ = UNIVERSAL_OBJECTS;

        let placeRequestNumber = 0;
        let placeSearchInProgress = false;

        const walkState = {
            enabled: false,
            x: 0,
            y: 0,
            zoom: 1,
            heading: 0
        };

        const WALK_STEP = 48;
        const WALK_ZOOM_STEP = 0.18;
        const WALK_TURN = 12;
        const WALK_ZOOM_MIN = 1;
        const WALK_ZOOM_MAX = 4.5;
        const WALK_PAN_MAX = 420;

        const DESTINATION_CLASSIFICATIONS = {
            "eiffel tower": "LANDMARK",
            "statue of liberty": "LANDMARK",
            "times square": "URBAN",
            "central park": "PARK",
            "grand canyon": "NATURAL",
            "yellowstone": "NATIONAL PARK",
            "mount everest": "MOUNTAIN",
            "tokyo": "CITY",
            "new york city": "CITY",
            "new york": "CITY",
            "paris": "CITY",
            "london": "CITY",
            "rome": "CITY",
            "venice": "CITY",
            "dubai": "CITY",
            "sydney": "CITY",
            "los angeles": "CITY",
            "chicago": "CITY",
            "las vegas": "CITY"
        };

        function createUniversalID() {
            const now = new Date();
            const date =
                now.getFullYear().toString() +
                String(now.getMonth() + 1).padStart(2, "0") +
                String(now.getDate()).padStart(2, "0");
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return "UO-" + date + "-" + random;
        }

        function normalizePlaceName(value) {
            return String(value || "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");
        }

        function classifyPlace(title, userInput) {
            const normalizedTitle = normalizePlaceName(title);
            const normalizedInput = normalizePlaceName(userInput);
            if (DESTINATION_CLASSIFICATIONS[normalizedTitle]) {
                return DESTINATION_CLASSIFICATIONS[normalizedTitle];
            }
            if (DESTINATION_CLASSIFICATIONS[normalizedInput]) {
                return DESTINATION_CLASSIFICATIONS[normalizedInput];
            }
            return "UNDEFINED";
        }

        function wikiFetch(url) {
            return fetch(url, { method: "GET" });
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function headingToRadians(deg) {
            return (deg * Math.PI) / 180;
        }

        function applyWalkTransform() {
            const layer = document.getElementById("placeWalkLayer");
            if (!layer) return;

            const x = walkState.x;
            const y = walkState.y;
            const zoom = walkState.zoom;
            const heading = walkState.heading;

            layer.dataset.placement = "move";
            layer.dataset.vector = x.toFixed(1) + "," + y.toFixed(1) + "," + zoom.toFixed(2);
            layer.dataset.heading = String(heading);

            layer.style.transform =
                "translate(" + x + "px, " + y + "px) " +
                "rotateY(" + heading + "deg) " +
                "scale(" + zoom + ")";

            const latest = getLatestUniversalObject();
            if (latest && latest.navigation) {
                latest.navigation.mode = "WALK";
                latest.navigation.walking = walkState.enabled;
                latest.navigation.vector = {
                    x: walkState.x,
                    y: walkState.y,
                    zoom: walkState.zoom,
                    heading: walkState.heading
                };
                latest.navigation.forward = "up";
                latest.navigation.backward = "down";
                latest.navigation.left = "left";
                latest.navigation.right = "right";
            }
        }

        function resetWalkState() {
            walkState.enabled = false;
            walkState.x = 0;
            walkState.y = 0;
            walkState.zoom = 1;
            walkState.heading = 0;
            applyWalkTransform();
        }

        function setWalkingEnabled(enabled) {
            walkState.enabled = !!enabled;
            const layer = document.getElementById("placeWalkLayer");
            const buttons = document.querySelectorAll("#placeNavigation button[data-direction]");
            const command = document.getElementById("walkCommand");
            const go = document.getElementById("walkGoButton");

            if (layer) {
                layer.classList.toggle("is-walking", walkState.enabled);
            }
            buttons.forEach(function (button) {
                button.disabled = !walkState.enabled;
            });
            if (command) command.disabled = !walkState.enabled;
            if (go) go.disabled = !walkState.enabled;

            if (walkState.enabled) {
                applyWalkTransform();
            }
        }

        function moveWalk(direction, steps) {
            if (!walkState.enabled) return false;

            const count = Number.isFinite(steps) && steps > 0 ? steps : 1;
            const rad = headingToRadians(walkState.heading);
            const forwardX = Math.sin(rad);
            const forwardY = -Math.cos(rad);

            for (let i = 0; i < count; i += 1) {
                if (direction === "up" || direction === "forward") {
                    walkState.x -= forwardX * WALK_STEP;
                    walkState.y -= forwardY * WALK_STEP * 0.35;
                    walkState.zoom = clamp(
                        walkState.zoom + WALK_ZOOM_STEP,
                        WALK_ZOOM_MIN,
                        WALK_ZOOM_MAX
                    );
                } else if (direction === "down" || direction === "back" || direction === "backward") {
                    walkState.x += forwardX * WALK_STEP;
                    walkState.y += forwardY * WALK_STEP * 0.35;
                    walkState.zoom = clamp(
                        walkState.zoom - WALK_ZOOM_STEP,
                        WALK_ZOOM_MIN,
                        WALK_ZOOM_MAX
                    );
                } else if (direction === "left") {
                    walkState.heading = walkState.heading - WALK_TURN;
                    walkState.x += WALK_STEP * 0.55;
                } else if (direction === "right") {
                    walkState.heading = walkState.heading + WALK_TURN;
                    walkState.x -= WALK_STEP * 0.55;
                } else if (direction === "look-left") {
                    walkState.heading = walkState.heading - WALK_TURN * 1.6;
                } else if (direction === "look-right") {
                    walkState.heading = walkState.heading + WALK_TURN * 1.6;
                } else if (direction === "reset") {
                    walkState.x = 0;
                    walkState.y = 0;
                    walkState.zoom = 1;
                    walkState.heading = 0;
                } else {
                    return false;
                }
            }

            walkState.x = clamp(walkState.x, -WALK_PAN_MAX, WALK_PAN_MAX);
            walkState.y = clamp(walkState.y, -WALK_PAN_MAX, WALK_PAN_MAX);
            walkState.heading = ((walkState.heading + 180) % 360 + 360) % 360 - 180;

            applyWalkTransform();

            const status = document.getElementById("placeStatus");
            if (status) {
                status.textContent =
                    "WALK " +
                    walkState.x.toFixed(0) + "," +
                    walkState.y.toFixed(0) + "," +
                    walkState.zoom.toFixed(2) +
                    "  H" + walkState.heading.toFixed(0);
            }
            return true;
        }

        function parseWalkCommand(raw) {
            let text = String(raw || "").trim().toLowerCase();
            if (!text) return null;
            if (text.indexOf("type:in") === 0) {
                text = text.replace(/^type:\s*in\s*/, "").trim();
            } else if (text.indexOf("type in") === 0) {
                text = text.replace(/^type\s+in\s*/, "").trim();
            }

            const parts = text.split(/\s+/);
            const action = parts[0] || "";
            const extra = parts[1] || "";
            const steps = Number(parts[parts.length - 1]);

            if (action === "forward" || action === "f" || action === "w" || action === "up") {
                return { direction: "forward", steps: steps };
            }
            if (action === "back" || action === "backward" || action === "s" || action === "down") {
                return { direction: "back", steps: steps };
            }
            if (action === "left" || action === "a") {
                return { direction: "left", steps: steps };
            }
            if (action === "right" || action === "d") {
                return { direction: "right", steps: steps };
            }
            if (action === "look" && (extra === "left" || extra === "right")) {
                return { direction: "look-" + extra, steps: steps };
            }
            if (action === "look-left" || action === "look-right") {
                return { direction: action, steps: steps };
            }
            if (action === "reset" || action === "center" || action === "stop") {
                return { direction: "reset", steps: 1 };
            }
            return null;
        }

        function runTypedWalkCommand() {
            const input = document.getElementById("walkCommand");
            if (!input) return;
            const parsed = parseWalkCommand(input.value);
            if (!parsed) {
                const status = document.getElementById("placeStatus");
                if (status) {
                    status.textContent =
                        "USE type:in forward | back | left | right | look left | reset";
                }
                return;
            }
            moveWalk(parsed.direction, parsed.steps);
        }

        function openPlaceExplorer() {
            const explorer = document.getElementById("placeExplorer");
            if (!explorer) return;
            explorer.style.display = "block";
            explorer.setAttribute("aria-hidden", "false");
            const search = document.getElementById("placeSearch");
            if (search) {
                window.setTimeout(function () {
                    search.focus();
                }, 50);
            }
        }

        function closePlaceExplorer() {
            const explorer = document.getElementById("placeExplorer");
            if (!explorer) return;
            explorer.style.display = "none";
            explorer.setAttribute("aria-hidden", "true");
        }

        function resetPlaceDisplay() {
            const image = document.getElementById("placeImage");
            const loading = document.getElementById("placeLoading");
            const universalID = document.getElementById("placeUniversalID");
            const title = document.getElementById("placeTitle");
            const classification = document.getElementById("placeClassification");
            const latitude = document.getElementById("placeLatitude");
            const longitude = document.getElementById("placeLongitude");

            resetWalkState();
            setWalkingEnabled(false);

            if (image) {
                image.onload = null;
                image.onerror = null;
                image.removeAttribute("src");
                image.alt = "";
                image.style.display = "none";
            }
            if (loading) {
                loading.style.display = "block";
                loading.textContent = "Searching...";
            }
            if (universalID) universalID.textContent = "—";
            if (title) title.textContent = "—";
            if (classification) classification.textContent = "UNDEFINED";
            if (latitude) latitude.textContent = "—";
            if (longitude) longitude.textContent = "—";
        }

        function parseCoordinates(page) {
            let latitude = null;
            let longitude = null;
            const list = page && page.coordinates;
            if (Array.isArray(list) && list.length > 0) {
                const coordinate = list[0];
                const lat = Number(coordinate && coordinate.lat);
                const lon = Number(coordinate && coordinate.lon);
                if (Number.isFinite(lat) && Number.isFinite(lon)) {
                    latitude = lat;
                    longitude = lon;
                }
            }
            return { latitude: latitude, longitude: longitude };
        }

        function parseImage(page) {
            if (page && page.original && page.original.source) {
                return page.original.source;
            }
            if (page && page.thumbnail && page.thumbnail.source) {
                return page.thumbnail.source;
            }
            return "";
        }

        function pageToResult(page, fallbackTitle) {
            let url = page.fullurl || "";
            if (!url && page.title) {
                url =
                    "https://en.wikipedia.org/wiki/" +
                    encodeURIComponent(String(page.title).replace(/ /g, "_"));
            }
            const coords = parseCoordinates(page);
            return {
                pageID: page.pageid || null,
                title: page.title || fallbackTitle,
                url: url,
                image: parseImage(page),
                latitude: coords.latitude,
                longitude: coords.longitude
            };
        }

        async function searchWikipediaPlace(place) {
            const cleanPlace = String(place || "").trim();
            if (!cleanPlace) {
                throw new Error("Please enter a destination.");
            }

            const encodedPlace = encodeURIComponent(cleanPlace);
            const apiURL =
                "https://en.wikipedia.org/w/api.php" +
                "?action=query" +
                "&generator=search" +
                "&gsrsearch=" + encodedPlace +
                "&gsrnamespace=0" +
                "&gsrlimit=5" +
                "&prop=pageimages|info|coordinates" +
                "&inprop=url" +
                "&piprop=thumbnail|original" +
                "&pithumbsize=1600" +
                "&redirects=1" +
                "&format=json" +
                "&formatversion=2" +
                "&origin=*";

            const response = await wikiFetch(apiURL);
            if (!response.ok) {
                throw new Error(
                    "Wikipedia request failed with HTTP " + response.status + "."
                );
            }

            const data = await response.json();
            const pages = data && data.query && Array.isArray(data.query.pages)
                ? data.query.pages
                : [];

            if (!pages.length) {
                throw new Error(
                    'No Wikipedia result was found for "' + cleanPlace + '".'
                );
            }

            let page = pages.find(function (item) {
                return item && item.missing !== true && !item.invalid;
            });

            if (!page) {
                throw new Error("The requested Wikipedia page could not be found.");
            }

            if (!parseCoordinates(page).latitude) {
                const withCoords = pages.find(function (item) {
                    return item && parseCoordinates(item).latitude !== null;
                });
                if (withCoords) page = withCoords;
            }

            return pageToResult(page, cleanPlace);
        }

        function displayPlaceResult(universalObject, result) {
            const image = document.getElementById("placeImage");
            const loading = document.getElementById("placeLoading");
            const universalID = document.getElementById("placeUniversalID");
            const title = document.getElementById("placeTitle");
            const classification = document.getElementById("placeClassification");
            const latitude = document.getElementById("placeLatitude");
            const longitude = document.getElementById("placeLongitude");
            const status = document.getElementById("placeStatus");
            const walkInput = document.getElementById("walkCommand");

            if (universalID) universalID.textContent = universalObject.universalID;
            if (title) title.textContent = result.title;
            if (classification) classification.textContent = universalObject.classification;
            if (latitude) {
                latitude.textContent =
                    result.latitude !== null ? String(result.latitude) : "N/A";
            }
            if (longitude) {
                longitude.textContent =
                    result.longitude !== null ? String(result.longitude) : "N/A";
            }

            if (result.image && image) {
                image.onload = function () {
                    image.style.display = "block";
                    if (loading) loading.style.display = "none";
                    resetWalkState();
                    setWalkingEnabled(true);
                    if (walkInput) {
                        walkInput.value = "";
                        walkInput.focus();
                    }
                    if (status) {
                        status.textContent =
                            "PLACE LOADED — type:in forward to walk the image";
                    }
                };
                image.onerror = function () {
                    image.style.display = "none";
                    setWalkingEnabled(false);
                    if (loading) {
                        loading.style.display = "block";
                        loading.textContent =
                            "The destination was found, but its image could not be loaded.";
                    }
                };
                image.src = result.image;
                image.alt = result.title;
            } else if (loading) {
                setWalkingEnabled(false);
                loading.style.display = "block";
                loading.textContent =
                    "Wikipedia found the place, but no image was available.";
            }

            if (status && !result.image) status.textContent = "PLACE LOADED";
        }

        async function loadRequestedPlace() {
            if (placeSearchInProgress) return;

            const search = document.getElementById("placeSearch");
            const status = document.getElementById("placeStatus");
            const loadButton = document.getElementById("loadPlaceButton");
            const loading = document.getElementById("placeLoading");
            if (!search) return;

            const userInput = search.value.trim();
            if (!userInput) {
                if (status) status.textContent = "ENTER A DESTINATION";
                search.focus();
                return;
            }

            const currentRequest = ++placeRequestNumber;
            placeSearchInProgress = true;

            if (loadButton) {
                loadButton.disabled = true;
                loadButton.textContent = "LOADING...";
            }

            resetPlaceDisplay();
            if (status) status.textContent = "SEARCHING WIKIPEDIA...";
            if (loading) {
                loading.style.display = "block";
                loading.textContent = "Searching for " + userInput + "...";
            }

            try {
                const result = await searchWikipediaPlace(userInput);
                if (currentRequest !== placeRequestNumber) return;

                const classification = classifyPlace(result.title, userInput);
                const universalObject = {
                    universalID: createUniversalID(),
                    objectType: "PLACE",
                    userInput: userInput,
                    wikipedia: {
                        pageID: result.pageID,
                        title: result.title,
                        url: result.url,
                        image: result.image
                    },
                    location: {
                        latitude: result.latitude,
                        longitude: result.longitude
                    },
                    classification: classification,
                    navigation: {
                        mode: "IMAGE",
                        walking: false,
                        vector: { x: 0, y: 0, zoom: 1, heading: 0 },
                        forward: "up",
                        backward: "down",
                        left: "left",
                        right: "right"
                    },
                    status: {
                        loaded: true,
                        explored: false
                    },
                    createdAt: new Date().toISOString()
                };

                UNIVERSAL_OBJECTS.push(universalObject);
                window.__UNIVERSAL_OBJECTS__ = UNIVERSAL_OBJECTS;
                displayPlaceResult(universalObject, result);
                console.log("UNIVERSAL OBJECT CREATED:", universalObject);
            } catch (error) {
                console.error("PLACE EXPLORER ERROR:", error);
                if (status) status.textContent = "ERROR";
                if (loading) {
                    loading.style.display = "block";
                    loading.textContent =
                        error && error.message
                            ? error.message
                            : "Unable to load destination.";
                }
            } finally {
                if (currentRequest === placeRequestNumber) {
                    placeSearchInProgress = false;
                    if (loadButton) {
                        loadButton.disabled = false;
                        loadButton.textContent = "LOAD PLACE";
                    }
                }
            }
        }

        function getUniversalObject(universalID) {
            return UNIVERSAL_OBJECTS.find(function (object) {
                return object.universalID === universalID;
            });
        }

        function getLatestUniversalObject() {
            if (UNIVERSAL_OBJECTS.length === 0) return null;
            return UNIVERSAL_OBJECTS[UNIVERSAL_OBJECTS.length - 1];
        }

        function handleExplorerKeydown(event) {
            if (event.key === "Escape") {
                closePlaceExplorer();
                return;
            }

            const target = event.target;
            const typingInSearch = target && target.id === "placeSearch";
            const typingInWalk = target && target.id === "walkCommand";

            if (event.key === "Enter") {
                if (typingInSearch) {
                    event.preventDefault();
                    loadRequestedPlace();
                    return;
                }
                if (typingInWalk) {
                    event.preventDefault();
                    runTypedWalkCommand();
                    return;
                }
            }

            if (typingInSearch || typingInWalk) return;
            if (!walkState.enabled) return;

            const key = event.key.toLowerCase();
            if (key === "arrowup" || key === "w") {
                event.preventDefault();
                moveWalk("forward");
            } else if (key === "arrowdown" || key === "s") {
                event.preventDefault();
                moveWalk("back");
            } else if (key === "arrowleft" || key === "a") {
                event.preventDefault();
                moveWalk("left");
            } else if (key === "arrowright" || key === "d") {
                event.preventDefault();
                moveWalk("right");
            } else if (key === "q") {
                event.preventDefault();
                moveWalk("look-left");
            } else if (key === "e") {
                event.preventDefault();
                moveWalk("look-right");
            } else if (key === "r") {
                event.preventDefault();
                moveWalk("reset");
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const appendButton = document.getElementById("appendNewObject");
            const closeButton = document.getElementById("closePlaceExplorer");
            const loadButton = document.getElementById("loadPlaceButton");
            const walkGo = document.getElementById("walkGoButton");
            const nav = document.getElementById("placeNavigation");

            if (appendButton) {
                appendButton.addEventListener("click", openPlaceExplorer);
            }
            if (closeButton) {
                closeButton.addEventListener("click", closePlaceExplorer);
            }
            if (loadButton) {
                loadButton.addEventListener("click", loadRequestedPlace);
            }
            if (walkGo) {
                walkGo.addEventListener("click", runTypedWalkCommand);
            }
            if (nav) {
                nav.addEventListener("click", function (event) {
                    const button = event.target.closest("button[data-direction]");
                    if (!button || button.disabled) return;
                    moveWalk(button.getAttribute("data-direction"));
                });
            }
            document.addEventListener("keydown", handleExplorerKeydown);
        });

        window.createUniversalID = createUniversalID;
        window.openPlaceExplorer = openPlaceExplorer;
        window.closePlaceExplorer = closePlaceExplorer;
        window.loadRequestedPlace = loadRequestedPlace;
        window.searchWikipediaPlace = searchWikipediaPlace;
        window.getUniversalObject = getUniversalObject;
        window.getLatestUniversalObject = getLatestUniversalObject;
        window.classifyPlace = classifyPlace;
        window.moveWalk = moveWalk;

        console.log("UNIVERSAL PLACE EXPLORER LOADED");
    </script>
</body>
</html>
